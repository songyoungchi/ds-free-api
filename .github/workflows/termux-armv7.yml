name: ساخت برای Termux (ARMv7)

on:
  workflow_dispatch:

env:
  TARGET: armv7-linux-androideabi
  ANDROID_API_LEVEL: 27

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: نصب Rust
      uses: dtolnay/rust-toolchain@stable

    - name: نصب target ARMv7
      run: rustup target add ${{ env.TARGET }}

    - name: نصب Android NDK
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
        unzip -q android-ndk-r27c-linux.zip
        echo "$PWD/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
        echo "ANDROID_NDK_HOME=$PWD/android-ndk-r27c" >> $GITHUB_ENV

    - name: تنظیم متغیرهای کامپایلر
      run: |
        echo "CC_armv7_linux_androideabi=armv7a-linux-androideabi${{ env.ANDROID_API_LEVEL }}-clang" >> $GITHUB_ENV
        echo "CXX_armv7_linux_androideabi=armv7a-linux-androideabi${{ env.ANDROID_API_LEVEL }}-clang++" >> $GITHUB_ENV
        echo "AR_armv7_linux_androideabi=llvm-ar" >> $GITHUB_ENV

    - name: تنظیم فایل کانفیگ کارگو (لینکر)
      run: |
        mkdir -p .cargo
        cat > .cargo/config.toml << 'EOF'
        [target.armv7-linux-androideabi]
        linker = "armv7a-linux-androideabi${{ env.ANDROID_API_LEVEL }}-clang"
        ar = "llvm-ar"
        EOF

    - name: کامپایل پروژه
      run: cargo build --release --target ${{ env.TARGET }}

    - name: آپلود خروجی
      uses: actions/upload-artifact@v4
      with:
        name: ds-free-api-android-armv7
        path: target/${{ env.TARGET }}/release/ds-free-api
